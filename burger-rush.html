<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Burger Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1b2e; overflow: hidden; touch-action: none;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: #fff; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; border-radius: 12px; box-shadow: 0 10px 40px #0008; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { background: #fffbeecc; color: #3a2a1a; padding: 24px 28px; border-radius: 18px; text-align: center;
    max-width: min(520px, calc(100vw - 32px)); box-sizing: border-box; box-shadow: 0 10px 40px #0006; backdrop-filter: blur(4px); }
  .card h1 { margin: 0 0 8px; font-size: 32px; color: #d9480f; }
  .card p { margin: 8px 0; line-height: 1.4; }
  .faces { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 10px 0; font-size: 28px; }
  .faces img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 3px 10px #0004; }
  button { font: inherit; font-size: 20px; font-weight: bold; padding: 12px 30px; border: 0; border-radius: 999px;
    background: #f76707; color: #fff; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #c2410c; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c2410c; }
  .hidden { display: none !important; }
  kbd { background: #3a2a1a; color: #fff; padding: 1px 7px; border-radius: 5px; font-size: 14px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="480"></canvas></div>
<div id="overlay">
  <div class="card" id="card">
    <h1 id="title">🍔 Burger Rush 💕</h1>
    <div class="faces"><img id="fHero" alt=""><span id="mid">➡️</span><img id="fGf" alt=""></div>
    <p id="msg">Ta copine s'éloigne ! Cours pour la rattraper…<br>
      Mais attention : <b>chaque burger mangé te fait grossir</b> et tu avances moins vite (et tu sautes moins haut).<br>
      🥗 Les salades te font maigrir.</p>
    <p><kbd>Espace</kbd> / <kbd>↑</kbd> ou <b>touche l'écran</b> pour sauter.</p>
    <button id="btn">JOUER</button>
  </div>
</div>

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = 400, HERO_X = 170;
const heroImg = new Image(); heroImg.src = HERO_SRC;
const gfImg = new Image(); gfImg.src = GF_SRC;
document.getElementById('fHero').src = HERO_SRC;
document.getElementById('fGf').src = GF_SRC;

// --- Réglages ---
const BASE_SPEED = 380;     // vitesse sans burger (px/s)
const GF_SPEED = 320;       // vitesse de la copine
const SLOW_PER_BURGER = 26; // perte de vitesse par burger
const MIN_SPEED = 120;
const START_GAP = 1400;     // avance de la copine au départ
const LOSE_GAP = 3200;      // si elle est trop loin : perdu

let S; // état du jeu
function reset() {
  S = {
    running: true, t: 0, burgers: 0, eaten: 0, salads: 0,
    heroWX: 0, gfWX: START_GAP, y: 0, vy: 0, onGround: true,
    items: [], popups: [], particles: [], nextSpawn: 0.8, anim: 0, shake: 0, fat: 0,
  };
}

const speed = () => Math.max(MIN_SPEED, BASE_SPEED - S.burgers * SLOW_PER_BURGER);
const bodyW = () => 34 + S.fat * 13;
const jumpPower = () => Math.max(540, 760 - S.burgers * 30);

// --- Audio ---
let ac;
function beep(f1, f2, dur, type = 'square', vol = 0.08) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}

// --- Contrôles ---
function jump() {
  if (!S || !S.running) return;
  if (S.onGround) { S.vy = -jumpPower(); S.onGround = false; beep(300, 600, 0.15, 'triangle'); }
}
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); jump(); }
  if (e.code === 'Enter' && !S?.running) start();
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

// --- Objets ---
function spawn() {
  const x = S.heroWX + W + 60;
  const r = Math.random();
  if (r < 0.55) S.items.push({ type: 'burger', x, y: GROUND - 22 });          // au sol : saute par-dessus
  else if (r < 0.75) S.items.push({ type: 'burger', x, y: GROUND - 178 });    // en l'air : ne saute pas
  else if (r < 0.9) S.items.push({ type: 'salad', x, y: GROUND - 200 });      // saute pour l'attraper
  else { // double burger
    S.items.push({ type: 'burger', x, y: GROUND - 22 });
    S.items.push({ type: 'burger', x: x + 55, y: GROUND - 22 });
  }
  const difficulty = Math.min(1, S.t / 60);
  S.nextSpawn = 0.75 + Math.random() * (1.1 - difficulty * 0.4);
}

function heroBox() {
  const bw = bodyW();
  return { x1: HERO_X - bw / 2 - 6, x2: HERO_X + bw / 2 + 6, y1: GROUND - S.y - 135, y2: GROUND - S.y };
}

function popup(text, x, y, color) { S.popups.push({ text, x, y, color, life: 1 }); }

const MIAM = ['MIAM !', 'Encore un…', 'Trop bon 🤤', '+1 kilo', 'Oups…', 'Slurp !', 'Double cheese !'];

// --- Boucle ---
let last = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  if (S && S.running) update(dt);
  if (S) draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  S.t += dt;
  const v = speed();
  S.heroWX += v * dt;
  S.gfWX += GF_SPEED * dt;
  S.anim += dt * v / 38;
  S.fat += (S.burgers - S.fat) * Math.min(1, dt * 6); // grossit en douceur

  // saut
  if (!S.onGround) {
    S.vy += 2000 * dt;
    S.y -= S.vy * dt;
    if (S.y <= 0) { S.y = 0; S.vy = 0; S.onGround = true; if (S.burgers > 3) S.shake = 0.15 + S.burgers * 0.02; }
  }

  // apparition
  S.nextSpawn -= dt;
  if (S.nextSpawn <= 0) spawn();

  // collisions
  const b = heroBox();
  for (const it of S.items) {
    if (it.done) continue;
    const sx = it.x - S.heroWX + HERO_X;
    if (sx > b.x1 - 18 && sx < b.x2 + 18 && it.y > b.y1 - 18 && it.y < b.y2 + 10) {
      it.done = true;
      if (it.type === 'burger') {
        S.burgers++; S.eaten++;
        popup(MIAM[Math.floor(Math.random() * MIAM.length)], HERO_X, b.y1 - 10, '#ffd43b');
        beep(180, 90, 0.25, 'sawtooth', 0.1);
        for (let i = 0; i < 10; i++) S.particles.push({ x: HERO_X + 20, y: b.y1 + 40, vx: Math.random() * 300 - 100, vy: -Math.random() * 300, life: 0.6, c: ['#e8a33d', '#6b3e1f', '#4caf50', '#e53935'][i % 4] });
      } else {
        S.salads++;
        if (S.burgers > 0) { S.burgers--; popup('Salade ! -1 kilo 💪', HERO_X, b.y1 - 10, '#69db7c'); }
        else popup('Déjà au top 💪', HERO_X, b.y1 - 10, '#69db7c');
        beep(500, 1000, 0.2, 'triangle', 0.1);
      }
    }
  }
  S.items = S.items.filter(it => !it.done && it.x - S.heroWX > -200);

  for (const p of S.popups) { p.y -= 40 * dt; p.life -= dt * 0.8; }
  S.popups = S.popups.filter(p => p.life > 0);
  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt; }
  S.particles = S.particles.filter(p => p.life > 0);
  S.shake = Math.max(0, S.shake - dt);

  // fin
  const gap = S.gfWX - S.heroWX;
  if (gap <= 40) end(true);
  else if (gap >= LOSE_GAP) end(false);
}

// --- Dessin ---
function circleImg(img, x, y, r, border) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = '#ddd'; ctx.fill();
  ctx.clip();
  if (img.complete) ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = border;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
}

function drawBurger(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#e8a33d'; ctx.beginPath(); ctx.ellipse(0, -8, 22, 14, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#fff6'; for (const [a, b] of [[-9, -15], [0, -18], [9, -14]]) { ctx.beginPath(); ctx.ellipse(a, b, 2, 1.2, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#4caf50'; ctx.fillRect(-23, -8, 46, 4);
  ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.moveTo(-22, -4); ctx.lineTo(22, -4); ctx.lineTo(10, 3); ctx.lineTo(-14, 2); ctx.fill();
  ctx.fillStyle = '#6b3e1f'; ctx.beginPath(); ctx.roundRect(-22, -2, 44, 9, 4); ctx.fill();
  ctx.fillStyle = '#d99632'; ctx.beginPath(); ctx.roundRect(-21, 7, 42, 9, [0, 0, 8, 8]); ctx.fill();
  ctx.restore();
}

function drawSalad(x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 4, 24, 12, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#2f9e44';
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 8, -2 - (2 - Math.abs(i)) * 3, 9, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#e03131'; ctx.beginPath(); ctx.arc(-6, -6, 4, 0, 7); ctx.arc(8, -4, 3.5, 0, 7); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#8ce99a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 30 + Math.sin(S.t * 6) * 3, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
}

function drawRunner(x, footY, bw, img, border, shirt, phase, airborne, isGirl) {
  const legLen = 34, bodyH = 58 + (isGirl ? 0 : S.fat * 3);
  const hipY = footY - legLen;
  const swing = airborne ? 0.6 : Math.sin(phase) * 0.7;
  // jambes
  ctx.strokeStyle = isGirl ? '#f1c7a5' : '#2b2b3a'; ctx.lineCap = 'round'; ctx.lineWidth = 9 + (isGirl ? 0 : S.fat * 1.3);
  for (const s of [swing, -swing]) {
    ctx.beginPath(); ctx.moveTo(x, hipY);
    ctx.lineTo(x + Math.sin(s) * legLen, hipY + Math.cos(s) * legLen); ctx.stroke();
  }
  // corps
  ctx.fillStyle = shirt;
  ctx.beginPath(); ctx.ellipse(x, hipY - bodyH / 2 + 6, bw / 2, bodyH / 2, 0, 0, Math.PI * 2); ctx.fill();
  if (isGirl) { // jupe
    ctx.fillStyle = '#e64980'; ctx.beginPath();
    ctx.moveTo(x - bw / 2, hipY - 6); ctx.lineTo(x + bw / 2, hipY - 6); ctx.lineTo(x + bw / 2 + 8, hipY + 10); ctx.lineTo(x - bw / 2 - 8, hipY + 10); ctx.fill();
  } else { // logo
    ctx.fillStyle = '#e03131'; ctx.fillRect(x + bw * 0.12, hipY - bodyH + 26, 7, 7);
  }
  // bras
  ctx.strokeStyle = isGirl ? '#f1c7a5' : '#1a1a1a'; ctx.lineWidth = 8;
  const shY = hipY - bodyH + 20;
  for (const s of [-swing, swing]) {
    ctx.beginPath(); ctx.moveTo(x, shY);
    ctx.lineTo(x + Math.sin(s) * 30 + (isGirl ? 0 : bw * 0.15), shY + Math.cos(s) * 26); ctx.stroke();
  }
  // tête
  circleImg(img, x + 4, hipY - bodyH - 16, 34, border);
}

function draw() {
  ctx.save();
  if (S.shake > 0) ctx.translate((Math.random() - 0.5) * 10 * S.shake * 4, (Math.random() - 0.5) * 6 * S.shake * 4);

  // ciel
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#ffb88c'); sky.addColorStop(1, '#ffe8cc');
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#fff3bf'; ctx.beginPath(); ctx.arc(780, 90, 46, 0, 7); ctx.fill();

  // immeubles (parallaxe)
  const off1 = (S.heroWX * 0.2) % 160;
  ctx.fillStyle = '#f4a68a';
  for (let i = -1; i < 8; i++) { const h = 90 + ((i * 53 + Math.floor(S.heroWX * 0.2 / 160) * 37) % 5) * 22; ctx.fillRect(i * 160 - off1, GROUND - h, 120, h); }
  const off2 = (S.heroWX * 0.5) % 240;
  for (let i = -1; i < 6; i++) {
    const k = i + Math.floor(S.heroWX * 0.5 / 240);
    const bx = i * 240 - off2;
    ctx.fillStyle = '#c2255c'; ctx.fillRect(bx + 20, GROUND - 120, 80, 120);
    ctx.fillStyle = '#ffd43b'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(k % 2 ? 'BURGER' : 'SNACK', bx + 60, GROUND - 100);
    ctx.fillStyle = '#ffec99';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) ctx.fillRect(bx + 32 + c * 34, GROUND - 85 + r * 26, 22, 16);
  }

  // sol
  ctx.fillStyle = '#495057'; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = '#868e96'; ctx.fillRect(-20, GROUND, W + 40, 8);
  ctx.fillStyle = '#f8f9fa';
  const off3 = S.heroWX % 80;
  for (let i = -1; i < 14; i++) ctx.fillRect(i * 80 - off3, GROUND + 40, 40, 5);

  // objets
  for (const it of S.items) {
    const sx = it.x - S.heroWX + HERO_X;
    const bob = it.y < GROUND - 50 ? Math.sin(S.t * 4 + it.x) * 5 : 0;
    if (it.type === 'burger') drawBurger(sx, it.y + bob); else drawSalad(sx, it.y + bob);
  }

  // copine
  const gap = S.gfWX - S.heroWX;
  const gfX = HERO_X + gap;
  if (gfX < W + 60) {
    drawRunner(gfX, GROUND, 34, gfImg, '#f783ac', '#f783ac', S.t * GF_SPEED / 38, false, true);
    ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('💕', gfX + 10, GROUND - 150 + Math.sin(S.t * 5) * 4);
  } else {
    // indicateur hors écran
    ctx.save(); ctx.translate(W - 70, 200);
    circleImg(gfImg, 0, 0, 28, '#f783ac');
    ctx.fillStyle = '#c2255c'; ctx.beginPath(); ctx.moveTo(36, -12); ctx.lineTo(54, 0); ctx.lineTo(36, 12); ctx.fill();
    ctx.fillStyle = '#3a2a1a'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(Math.round(gap / 10) + ' m', 0, 50);
    ctx.restore();
  }

  // héros
  ctx.fillStyle = '#0003'; ctx.beginPath();
  ctx.ellipse(HERO_X, GROUND + 4, bodyW() / 2 + 10 - S.y * 0.05, 6, 0, 0, 7); ctx.fill();
  drawRunner(HERO_X, GROUND - S.y, bodyW(), heroImg, '#fff', '#212529', S.anim, !S.onGround, false);

  // particules + popups
  for (const p of S.particles) { ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 6, 6); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
  for (const p of S.popups) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.lineWidth = 4; ctx.strokeStyle = '#3a2a1a';
    ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD(gap);
}

function drawHUD(gap) {
  // barre de progression
  const bx = 220, bw = 520, by = 24;
  ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.roundRect(bx - 10, by - 14, bw + 20, 28, 14); ctx.fill();
  const pct = Math.max(0, Math.min(1, 1 - gap / LOSE_GAP));
  ctx.fillStyle = pct > 0.6 ? '#69db7c' : pct > 0.3 ? '#ffd43b' : '#ff6b6b';
  ctx.beginPath(); ctx.roundRect(bx, by - 6, bw * pct, 12, 6); ctx.fill();
  circleImg(heroImg, bx + bw * pct, by, 15, '#fff');
  circleImg(gfImg, bx + bw, by, 15, '#f783ac');

  // stats
  ctx.textAlign = 'left'; ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
  const kg = 78 + S.burgers * 4;
  const lines = [`🍔 ${S.eaten} mangés`, `⚖️ ${kg} kg`, `🏃 ${Math.round(speed() / BASE_SPEED * 100)} % vitesse`];
  lines.forEach((l, i) => {
    ctx.lineWidth = 4; ctx.strokeStyle = '#3a2a1a'; ctx.strokeText(l, 14, 60 + i * 24);
    ctx.fillStyle = '#fff'; ctx.fillText(l, 14, 60 + i * 24);
  });
  if (speed() <= GF_SPEED && S.running) {
    ctx.textAlign = 'center'; ctx.font = 'bold 20px "Trebuchet MS", sans-serif';
    const msg = 'Trop lourd ! Elle s\'éloigne… mange une salade 🥗';
    ctx.globalAlpha = 0.6 + Math.sin(S.t * 8) * 0.4;
    ctx.strokeStyle = '#3a2a1a'; ctx.strokeText(msg, W / 2, H - 22);
    ctx.fillStyle = '#ff8787'; ctx.fillText(msg, W / 2, H - 22); ctx.globalAlpha = 1;
  }
}

// --- Écrans ---
const overlay = document.getElementById('overlay');
function start() {
  overlay.classList.add('hidden');
  reset();
}
function end(win) {
  S.running = false;
  const t = S.t.toFixed(1);
  document.getElementById('title').textContent = win ? '💕 Rattrapée ! 💕' : '💔 Elle est partie…';
  document.getElementById('mid').textContent = win ? '❤️' : '💨';
  document.getElementById('msg').innerHTML = win
    ? `Bravo ! Tu l'as rattrapée en <b>${t} s</b> en mangeant <b>${S.eaten}</b> burger${S.eaten > 1 ? 's' : ''}.<br>${S.eaten === 0 ? 'Régime parfait 🥗' : S.eaten > 8 ? "L'amour est plus fort que les burgers 🍔" : 'Pas mal du tout !'}`
    : `Avec <b>${S.eaten}</b> burgers dans le ventre (${78 + S.burgers * 4} kg), tu n'as pas pu suivre…<br>Saute par-dessus les burgers et attrape les salades !`;
  document.getElementById('btn').textContent = 'REJOUER';
  overlay.classList.remove('hidden');
  if (win) { beep(523, 1046, 0.4, 'triangle', 0.12); setTimeout(() => beep(659, 1318, 0.5, 'triangle', 0.12), 200); }
  else beep(300, 80, 0.8, 'sawtooth', 0.1);
}
document.getElementById('btn').addEventListener('click', start);

// écran d'accueil animé en fond
reset(); S.running = false;
requestAnimationFrame(loop);
</script>
</body>
